[group:default]
programs=api

; [program:gunicorn]
; command=/home/ubuntu/tenants_back/bin/gunicorn_start.sh
; ; No user= here on purpose: supervisor launches the script as root, and
; ; gunicorn itself drops privileges via --user=ubuntu --group=www-data. That
; ; lets it set the process group to www-data (a non-root start could not, since
; ; supplementary group membership is not enough for setgid) and chown the socket
; ; to ubuntu:www-data so nginx can connect.
; autostart=true
; autorestart=true
; stopwaitsecs=30
; stopsignal=TERM
; stdout_logfile=/var/log/gunicorn.log
; stderr_logfile=/var/log/gunicorn.err.log
; environment=PYTHONUNBUFFERED=1


[program:api]
command=/home/ubuntu/mt-shards-back-test/bin/gunicorn_start.sh
user=ubuntu
group=ubuntu
stdout_logfile=/home/ubuntu/mt-shards-back-test/logs/gunicorn_supervisor.log
redirect_stderr=true
# No APM here. A NEWRELIC_ENABLED=true used to sit on this line; nothing read it — the agent
# is in neither requirements.txt nor the venv, and the name does not even match what the New
# Relic agent reads (NEW_RELIC_ENABLED, with the underscore). It only made the deployment look
# instrumented. If APM is ever wired up, it goes in the command as
# `newrelic-admin run-program …` plus NEW_RELIC_LICENSE_KEY / NEW_RELIC_APP_NAME here.
environment=LANG=en_US.UTF-8,LC_ALL=en_US.UTF-8
